<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#77e5c1"/></marker></defs><rect width="1200" height="620" rx="24" fill="#090e19"/><g font-family="Arial,sans-serif"><text x="42" y="50" fill="#edf3fc" font-size="25" font-weight="bold">Two inference modes. One monitoring experience.</text><text x="42" y="80" fill="#9aaac1" font-size="15">Expo Go + Python remain available. The web app also runs vision locally.</text><rect x="32" y="118" width="720" height="398" rx="20" fill="#101a2a" stroke="#24334a"/><text x="55" y="152" fill="#77e5c1" font-size="13" letter-spacing="2">LOCAL PYTHON SERVER</text><g fill="#152438" stroke="#334760"><rect x="55" y="190" width="175" height="95" rx="12"/><rect x="270" y="190" width="215" height="95" rx="12"/><rect x="55" y="355" width="175" height="95" rx="12"/><rect x="270" y="355" width="215" height="95" rx="12"/><rect x="535" y="248" width="187" height="153" rx="12"/></g><g fill="#edf3fc" font-size="18"><text x="73" y="226">Computer camera</text><text x="290" y="226">Vision pipeline</text><text x="73" y="391">Microphone</text><text x="290" y="391">Speech pipeline</text><text x="557" y="286">FastAPI</text></g><g fill="#9aaac1" font-size="13"><text x="73" y="254">OpenCV capture</text><text x="290" y="253">MediaPipe + YOLO</text><text x="73" y="418">Optional, opt-in</text><text x="290" y="419">Whisper / Google</text><text x="557" y="313">State + cooldowns</text><text x="557" y="338">WebSocket status</text><text x="557" y="363">JPEG / MJPEG</text></g><g fill="none" stroke="#77e5c1" stroke-width="2" marker-end="url(#arrow)"><path d="M230 238h38"/><path d="M230 402h38"/><path d="M485 238h25v48h23"/><path d="M485 402h25v-37h23"/><path d="M722 287h61v-57h45"/><path d="M722 365h61v49h45"/></g><g fill="#101a2a" stroke="#24334a"><rect x="830" y="157" width="325" height="143" rx="18"/><rect x="830" y="346" width="325" height="143" rx="18"/></g><text x="854" y="194" fill="#77e5c1" font-size="13" letter-spacing="2">EXPO GO / MOBILE</text><text x="854" y="230" fill="#edf3fc" font-size="19">React Native app</text><text x="854" y="263" fill="#9aaac1" font-size="13">LAN connection + local notifications</text><text x="854" y="383" fill="#77e5c1" font-size="13" letter-spacing="2">VERCEL / WEB</text><text x="854" y="419" fill="#edf3fc" font-size="19">React Native Web</text><text x="854" y="452" fill="#9aaac1" font-size="13">Webcam + local MediaPipe / EfficientDet</text><text x="854" y="476" fill="#9aaac1" font-size="12">Optional external HTTPS/WSS server</text><text x="42" y="565" fill="#9aaac1" font-size="15">DEMO PATH: scenarios → client state → illustrated dashboard. No inference, camera or microphone.</text></g></svg>