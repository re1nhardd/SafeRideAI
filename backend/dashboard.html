<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SafeRide AI · Local monitor</title><style>
*{box-sizing:border-box}body{font:15px system-ui;margin:0;background:#090e19;color:#edf3fc;padding:32px}main{max-width:980px;margin:auto}h1{font-size:32px}a{color:#77e5c1}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.card{background:#101a2a;border:1px solid #24334a;border-radius:18px;padding:20px;margin:16px 0}img{width:100%;border-radius:12px}.muted{color:#9aaac1}#state{color:#77e5c1;font-size:23px}#score{font-size:48px}dt{color:#9aaac1}dd{margin:6px 0 18px}p{line-height:1.6}.alert{color:#ff868c}@media(max-width:650px){body{padding:18px}.grid{display:block}}
</style></head><body><main><p class="muted">SAFERIDE AI / LOCAL INFERENCE</p><h1>Driver monitoring</h1><p id="connection">Connecting…</p><div class="grid"><section class="card"><h2>Server camera</h2><img id="camera" alt="Annotated camera frames" hidden><p id="placeholder" class="muted">Waiting for camera</p></section><section class="card"><h2 id="state">Waiting for data</h2><p id="score">—</p><dl><dt>Phone</dt><dd id="phone">No data</dd><dt>Speech</dt><dd id="speech">No transcript</dd></dl></section></div><p id="alert" class="alert" role="alert"></p><p class="muted">Research prototype. Test while parked. This dashboard uses the camera on the server computer.</p></main><script>
let ws,retry,watchdog;const el=id=>document.getElementById(id);function offline(){el('state').textContent='Monitoring unavailable';el('score').textContent='—';el('phone').textContent='No data';el('camera').hidden=true;el('camera').removeAttribute('src');el('placeholder').hidden=false;}
function connect(){ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws`);ws.onopen=()=>{el('connection').textContent='Connected to local server';watchdog=setTimeout(()=>ws.close(),10000)};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='alert'){el('alert').textContent=m.message;return}if(m.type!=='status')return;clearTimeout(watchdog);watchdog=setTimeout(()=>ws.close(),10000);const d=m.data;const ready=d.camera_ready&&d.detector_ready&&d.face_detected&&d.calibrated;el('state').textContent=d.error||(ready?(d.alert==='NONE'?'Monitoring active':d.alert):!d.camera_ready?'Waiting for camera':!d.face_detected?'No face detected':'Calibrating');el('score').textContent=ready?`${Math.round(d.attention)}%`:'—';el('phone').textContent=ready?(d.phone_detected?'Detected':'Clear'):'No data';el('speech').textContent=d.speech_text||'No transcript';if(d.camera_ready){if(!el('camera').getAttribute('src'))el('camera').src='/stream';el('camera').hidden=false;el('placeholder').hidden=true}else{el('camera').hidden=true;el('camera').removeAttribute('src');el('placeholder').hidden=false}};ws.onerror=()=>ws.close();ws.onclose=()=>{clearTimeout(watchdog);offline();el('connection').textContent='Disconnected. Reconnecting…';retry=setTimeout(connect,3000)}}window.addEventListener('pagehide',()=>{clearTimeout(retry);clearTimeout(watchdog);ws.onclose=null;ws.close()});connect();
</script></body></html>
